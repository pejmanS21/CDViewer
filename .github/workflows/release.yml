name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Windows x86-64 only — the single target burned onto study CDs.
  # Linux/macOS/ARM legs were removed deliberately; nobody is shipped
  # those builds. The dropped aarch64-windows leg is covered anyway:
  # ARM Windows runs the x86-64 binary under emulation.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows ----------------------------------------------------
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: dicom-viewer.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage payload
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          ver="$GITHUB_REF_NAME"
          name="dicom-viewer-${ver}-${TARGET}"
          stage="dist/release/${name}"
          mkdir -p "$stage"

          cp "target/${TARGET}/release/${BIN}" "$stage/"
          for f in dist/README.txt dist/HELP.txt LICENSE CHANGELOG.md; do
            [[ -f "$f" ]] && cp "$f" "$stage/" || true
          done
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/autorun.inf "$stage/" || true
          fi

          if [[ "$ARCHIVE" == "zip" ]]; then
            (cd dist/release && 7z a -tzip "../${name}.zip" "${name}" >/dev/null)
            echo "ARTIFACT=dist/${name}.zip" >> "$GITHUB_ENV"
          else
            tar -C dist/release -czf "dist/${name}.tar.gz" "${name}"
            echo "ARTIFACT=dist/${name}.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
