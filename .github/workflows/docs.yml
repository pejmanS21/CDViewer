name: Docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep at most one Pages deployment in flight at a time. New pushes
# cancel any older in-progress run for the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  build:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: Build rustdoc
        run: cargo doc --no-deps --lib

      # Redirect the Pages root (`/`) to the crate's index so visitors
      # don't land on an empty 404. `cargo doc` only writes
      # `dicom_viewer/index.html` under `target/doc/`.
      - name: Stage Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R target/doc/. site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>CDViewer — rustdoc</title>
          <meta http-equiv="refresh" content="0; url=dicom_viewer/index.html">
          <link rel="canonical" href="dicom_viewer/index.html">
          <p>Redirecting to <a href="dicom_viewer/index.html">dicom_viewer</a>…</p>
          HTML
          # GitHub Pages serves anything under the upload; .nojekyll
          # disables Jekyll so files starting with `_` (rustdoc uses
          # `_search.js`, etc.) are not stripped.
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
