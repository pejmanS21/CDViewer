name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Windows x86-64 only — that is the sole shipped target (see release.yml).
  # The Linux/macOS/ARM legs were dropped deliberately: they burned CI
  # minutes on platforms nobody receives a build for. Restore a leg here
  # (with its apt-get step, see README.md) if that ever changes.
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows ----------------------------------------------------
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Tests
        if: matrix.test
        run: cargo test --all-features --target ${{ matrix.target }}
