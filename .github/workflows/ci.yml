name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux ------------------------------------------------------
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            test: true

          # ---- macOS ------------------------------------------------------
          - target: x86_64-apple-darwin
            os: macos-13
            test: true
          - target: aarch64-apple-darwin
            os: macos-14
            test: true

          # ---- Windows ----------------------------------------------------
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            test: false       # cross-compiled — can't execute aarch64 on x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Tests
        if: matrix.test
        run: cargo test --all-features --target ${{ matrix.target }}
