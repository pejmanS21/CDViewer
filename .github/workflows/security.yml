name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly sweep so the latest Semgrep / Gitleaks rulesets still grade
    # the existing history clean even if nothing has changed.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- Secret scanning -------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF findings to GHAS
      pull-requests: write     # comment with leaked-secret summary
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commits that introduced a secret can be
          # located by SHA, not just diffed against the previous push.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for *organisation-owned private* repos.
          # Personal private repos and any public repo run free.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci
