name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly sweep so the latest Semgrep / Gitleaks rulesets still grade
    # the existing history clean even if nothing has changed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- Secret scanning -------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF findings to GHAS
      pull-requests: write     # comment with leaked-secret summary
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commits that introduced a secret can be
          # located by SHA, not just diffed against the previous push.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for *organisation-owned private* repos.
          # Personal private repos and any public repo run free.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  # ---- Static application security testing -----------------------------
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    permissions:
      contents: read
      security-events: write
    # Dependabot can't read secrets, so opt it out cleanly.
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        # `--config=auto` fetches Semgrep's curated ruleset for every
        # detected language (Rust included). `--severity=ERROR` plus
        # `--error` gates the build only on high-severity findings —
        # noise-level lints still appear in SARIF for review.
        run: |
          semgrep scan \
            --config=auto \
            --sarif-output=semgrep.sarif \
            --metrics=off \
            --error \
            --severity=ERROR
        env:
          # Optional. Without it, Semgrep runs the community ruleset
          # locally. With it, findings are also reported to your
          # Semgrep Cloud dashboard / custom policies.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Code Scanning
        if: always()      # surface findings even when the scan failed
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
