[package]
name = "dicom-viewer"
version = "0.1.0"
edition = "2021"
authors = ["AIMedic"]
description = "Portable, non-diagnostic DICOM viewer"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[[bin]]
name = "dicom-viewer"
path = "src/main.rs"

# --- Milestone 1 dependencies (skeleton: window, config, logging) -----------
# Additional crates (dicom-rs, rusqlite, tokio, windows-rs, etc.) are added
# in later milestones to keep the initial cold-build fast and the binary
# small while the skeleton is being validated.

[dependencies]
# UI framework — chosen for static linking and no system deps
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }

# Config & serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Errors
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Paths
directories = "5"

# File dialogs
rfd = "0.15"

# DICOM
dicom = "0.7"
dicom-pixeldata = { version = "0.7", features = ["image"] }
dicom-dictionary-std = "0.7"

# Image conversions for DICOM -> RGBA8
image = { version = "0.25", default-features = false, features = ["png"] }

# Parallel folder scan
rayon = "1"

# Annotation sidecar persistence
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
debug = false
incremental = false

[profile.dev]
opt-level = 1          # debug builds stay responsive when rendering
debug = true
incremental = true

# Faster iteration: optimize dependencies even in dev
[profile.dev.package."*"]
opt-level = 3
