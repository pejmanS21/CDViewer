[package]
name = "dicom-viewer"
version = "0.1.3"
edition = "2021"
authors = ["AIMedic"]
description = "Portable, non-diagnostic DICOM viewer"
license = "Apache-2.0"
rust-version = "1.80"

[[bin]]
name = "dicom-viewer"
path = "src/main.rs"

# --- Milestone 1 dependencies (skeleton: window, config, logging) -----------
# Additional crates (dicom-rs, rusqlite, tokio, windows-rs, etc.) are added
# in later milestones to keep the initial cold-build fast and the binary
# small while the skeleton is being validated.

[dependencies]
# UI framework — chosen for static linking and no system deps.
# wayland + x11 are no-ops on macOS/Windows; on Linux they pull the
# matching winit backend in (without them, winit fails with
# "platform not supported by winit" on Linux).
#
# `glow` (OpenGL 3.3), NOT `wgpu`. This is a CD-distribution constraint,
# not a preference: wgpu on Windows needs DX12 (Windows 10 + feature-level
# 11 hardware) or Vulkan drivers, so it fails to *launch* on older Intel
# HD parts, stock Win7/8.1 boxes, VMs and RDP sessions. OpenGL 3.3 goes
# back to ~2011 Intel HD 3000. It is also much smaller — no naga, no
# DX12/Vulkan HAL backends.
#
# `persistence` is deliberately absent: window/UI state is saved by
# `config::Config` (TOML) and annotations by `dcm::annotation` (JSON),
# so eframe's own storage layer would be dead weight.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"

# Config & serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Errors
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Paths
directories = "5"

# File dialogs
rfd = "0.15"

# DICOM
dicom = "0.7"
dicom-pixeldata = { version = "0.7", default-features = false, features = ["rayon"] }
dicom-dictionary-std = "0.7"

# Image conversions for DICOM -> RGBA8
image = { version = "0.25", default-features = false, features = ["png"] }

# Parallel folder scan
rayon = "1"

# Annotation sidecar persistence
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
debug = false
incremental = false

# Fast local release builds — thin LTO, multiple codegen units.
# Slightly larger binary, ~40-50% faster link.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = "s"

[profile.dev]
opt-level = 1          # debug builds stay responsive when rendering
debug = true
incremental = true

# Faster iteration: optimize dependencies even in dev
[profile.dev.package."*"]
opt-level = 3
